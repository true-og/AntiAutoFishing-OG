# AntiAutoFishing-OG configuration

# How far a player may move between catches and still count as the same spot.
# Stationary auto-fishers stay within this radius; humans wander out and reset.
max-fish-distance:
  enabled: true
  distance: 3 # Blocks from the last fishing location.

# Timing analysis flags inhuman catch timing, regardless of position.
# Either check below can trip the captcha.
fishing-timing:
  enabled: true
  sample-size: 15 # Most recent catches kept per player.
  min-catches: 10 # Catches required before judging (clamped to <= sample-size).
  # Catch-interval check: how regular the gaps between catches are.
  # Vanilla randomizes the bite wait (~5-30s), so this mainly catches fixed-timer bots.
  cv-threshold: 0.1 # Flag when interval variation falls below this. Higher = more flags.
  # Reaction check: time from a fish biting to the player reeling in. The stronger signal.
  reaction-enabled: true
  reaction-floor-ms: 120 # Average reaction faster than this (ms) is inhuman.
  reaction-cv-threshold: 0.15 # Also flag overly consistent reactions, when fast (see below).
  reaction-max-mean-ms: 400 # The reaction-cv check only applies below this average (ms).

# Captcha: the player must click the target item in a GUI to keep fishing.
# This is the response used when a player is flagged.
fishing-captcha:
  enabled: true
  block-fishing-until-solved: true # Cancel catches until solved. Disable if players ever get stuck.
  captcha-item: 'EMERALD' # Item the player must click.
  inventory-name: '<green>Click the emerald to verify!</green>'
  inventory-size: 36
  success-message: '<green>You have successfully verified.</green>'
  closed-inv-message: '<red>You must complete the captcha to continue.</red>'
  exploit-numbers: [12] # Same-spot catch totals that open the captcha.

# Temporary cooldown between catches at the listed same-spot totals.
fishing-cooldown:
  enabled: false
  length: 30 # Cooldown in seconds.
  exploit-numbers: [5, 6, 7, 8, 9, 10]

# Warning message at the listed same-spot totals.
fishing-messages:
  enabled: false
  message: '<red>Please move around while fishing.</red>'
  exploit-numbers: [5, 6, 7, 8, 9, 10]

# Block catches at the listed same-spot totals.
disallow-fish:
  enabled: false
  exploit-numbers: [5, 6, 7, 8, 9, 10]

# Kick the player at the listed same-spot totals.
kicking-players:
  enabled: true
  message: '<red>You were detected for auto fishing.</red>'
  exploit-numbers: [30]
